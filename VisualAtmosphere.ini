; ============================================================
;  VisualAtmosphere - Native DirectX 12 Atmosphere Engine
;  Dark Fantasy / Souls-like Cinematic Visual Filter
;  Zero performance loss, fully compatible with PureDark DLSS FG
; ============================================================

[Atmosphere]
; Включить визуальные эффекты атмосферы (true / false)
EnableAtmosphere = true

; Холодный сланцевый спектральный фильтр (срезает желтизну и теплый туман Междуземья)
; Диапазон: 0.00 (выкл) до 0.50 (сильно выраженный). Рекомендуется: 0.10 - 0.14
ColdTintIntensity = 0.12
ColdTintR = 8
ColdTintG = 20
ColdTintB = 36

; Мягкая кинематографическая виньетка по краям экрана
; Диапазон: 0.00 (выкл) до 0.80 (выраженная). Рекомендуется: 0.20 - 0.25
VignetteIntensity = 0.22

; Глубина охвата виньетки от краев (0.15 = только тонкие края, 0.25 = мягкий четверть-экранный градиент)
VignetteSize = 0.25

; Глубина теней / контрастность полутеней
; Диапазон: 0.00 (выкл) до 0.20 (глубокие черные тени). Рекомендуется: 0.04 - 0.07
ShadowDepth = 0.05

[Hotkeys]
; Горячая клавиша мгновенного включения/отключения эффекта на лету в игре (0x74 = F5)
ToggleKey = 0x74

; Горячая клавиша перезагрузки конфига без перезапуска игры (0x75 = F6)
ReloadKey = 0x75
